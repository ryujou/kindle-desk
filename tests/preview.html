<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kindle 程序 · 本机预览</title><style>*{box-sizing:border-box}body{font:16px 'Segoe UI','Microsoft YaHei',sans-serif;background:#e9ece8;color:#1c241e;margin:24px auto;max-width:1200px;padding:0 20px}h1{font-size:24px}p{line-height:1.8;color:#505a52}select,button{font:inherit;padding:10px;border:1px solid #aaa;border-radius:5px;background:white;color:#111}iframe{display:block;width:100%;aspect-ratio:1000/740;border:20px solid #242824;border-radius:20px;background:white;margin-top:22px}.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap}button{cursor:pointer}</style><h1>精密仪表 · Kindle 程序预览</h1><p>这里运行打包给 Kindle 的同一份界面代码。数据由本机测试服务模拟，没有读取或切换真实 Codex 账号。</p><div class="controls"><label>测试场景 <select id="scenario"><option value="plus">Plus 账号 A</option><option value="pro">Pro 账号 B</option><option value="switching">Plus → Pro 切换中</option><option value="mismatch">新账号收到旧账号额度</option><option value="signed_out">Codex 未登录</option><option value="single">仅返回一个额度周期</option><option value="multi">多个独立额度桶</option><option value="low">额度偏低</option><option value="offline">电脑离线</option><option value="stale">数据过期</option><option value="reset">额度周期已到</option></select></label><button id="open">重新打开程序</button><span id="state">模拟数据</span><label>陪伴时间 <select id="care-time"><option value="86400">一天</option><option value="604800">一周</option><option value="-3600">时钟倒退一小时</option></select></label><button id="care-advance">测试时间</button></div><iframe id="app" title="Kindle 精密仪表程序" src="/"></iframe><p>短按人物切换动作，长按人物打开照料菜单。此预览的陪伴存档仅保存在当前浏览器，与 18770 动态仿真和 Kindle 各自独立。</p><p>选择场景会在当前程序中刷新数据，可直接观察账号切换。点击“返回阅读”会停止界面轮询；设备上的原生 X 和 KUAL 停止入口需越狱后验证。竖向窗口会将程序顺时针旋转，以供横放使用。</p><script>const frame=document.getElementById('app');document.getElementById('scenario').onchange=async e=>{await fetch('/scenario?name='+e.target.value);const b=frame.contentDocument.getElementById('refresh');if(!frame.contentDocument.getElementById('closed').hidden)frame.contentDocument.getElementById('resume').click();else b.click()};document.getElementById('open').onclick=()=>frame.contentWindow.location.reload();document.getElementById('care-advance').onclick=()=>{const care=frame.contentWindow.DeskCompanion.care;if(care)care.advance(Number(document.getElementById('care-time').value))};</script></html>
