<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kindle Desk</title><link rel="stylesheet" href="style.css"></head>
<body><main id="desk">
<header><strong>DESK / 桌面</strong><span id="connection">电脑未连接</span><button id="exit">返回阅读</button></header>
<section id="clock-panel" aria-label="时钟"><canvas id="dial" width="620" height="620" aria-label="指针时钟"></canvas><div id="time">--:--</div><div id="date"></div></section>
<section id="data-panel"><h1>电脑性能 <span>WINDOWS</span></h1>
<div class="metric"><span class="label">CPU</span><div class="gauge"><div id="cpu-bar"></div></div><strong id="cpu">—</strong></div>
<div class="metric"><span class="label">RAM</span><div class="gauge"><div id="ram-bar"></div></div><strong id="ram">—</strong></div>
<div class="metric"><span class="label">GPU</span><div class="gauge"><div id="gpu-bar"></div></div><strong id="gpu">—</strong></div>
<div id="hardware-note"><span id="memory">内存 —</span><span id="temperature">显卡温度 —</span></div>
<section id="companion"><button id="pet" type="button" aria-label="点击宠物切换动作"></button><div id="bubble"><div id="pet-state"></div><div id="pet-message" tabindex="0"></div><div id="ambient-info" hidden><div id="ambient-indoor" hidden>
<div class="environment-reading"><div><strong id="room-temperature"></strong><span>℃</span></div><small>室温</small></div><div class="environment-reading"><div><strong id="room-humidity"></strong><span>%</span></div><small>湿度</small></div><div class="environment-reading"><div><strong id="room-pm25"></strong><span class="particle-unit">μg/m³</span></div><small>PM2.5</small></div></div>
<div id="ambient-weather" role="button" tabindex="0" aria-label="查看天气详情" hidden><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 24h16a5 5 0 0 0 0-10h-1a8 8 0 0 0-15 2 4 4 0 0 0 0 8Z"/></svg><span id="outdoor-weather"></span><small>室外</small></div><div id="environment-age"></div></div></div></section><section id="codex"><div class="quota-heading"><strong id="task-open" role="button" tabindex="0" aria-label="查看当前任务和主账号额度">Codex <span id="plan"></span></strong><span id="quota-state">额度未获取</span></div><div id="account">账号未确认</div><div id="quota-rows"></div><section id="other-account" hidden><div class="other-heading"><strong id="other-task-open" role="button" tabindex="0" aria-label="查看当前任务和另一账号额度">Codex <span id="other-plan"></span></strong></div><div id="other-rows"></div></section><div id="quota-nav"><button id="next" hidden>下一组</button></div></section>
</section><footer><span id="message"></span><button id="clean">清除残影</button><button id="refresh">刷新数据</button></footer>
<section id="details" hidden aria-labelledby="details-title"><div class="details-heading"><h2 id="details-title"></h2><button id="details-back" type="button">返回桌面</button></div><div id="details-notice"></div><div id="details-content"></div></section>
<section id="closed" hidden><h2>信息屏已停止</h2><p id="close-message">正在返回原系统…</p><button id="resume">重新打开信息屏</button></section>
</main><script src="model.js"></script><script src="pet.js"></script><script src="standby.js"></script><script src="companion.js"></script><script src="app.js"></script></body></html>
